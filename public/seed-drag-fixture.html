<!doctype html>
<meta charset="utf-8">
<title>Seed drag-retime fixture</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; background:#140b0b; color:#f5eaea;
         max-width:44rem; margin:0 auto; padding:2.5rem 1.5rem; }
  h1 { font-size:1.35rem; margin:0 0 .25rem; }
  p.sub { color:#f5eaea99; margin:0 0 1.75rem; }
  #log { white-space:pre-wrap; font:13px/1.55 ui-monospace, monospace;
         background:#00000055; border-left:3px solid #e2705f; padding:.9rem 1rem; border-radius:6px; }
  a.go { display:inline-block; margin-top:1.5rem; background:#e2705f; color:#fff;
         padding:.7rem 1.1rem; border-radius:8px; text-decoration:none; font-weight:600; }
  table { border-collapse:collapse; margin-top:1.5rem; font-size:13.5px; width:100%; }
  th,td { text-align:left; padding:.4rem .7rem; border-bottom:1px solid #ffffff1a; }
  th { color:#f5eaea99; font-weight:600; }
  code { background:#00000055; padding:.1rem .35rem; border-radius:4px; }
</style>
<h1>Seed the drag re-timing fixture</h1>
<p class="sub">Writes one synthetic song into this browser so you can judge the drag by ear.
Tone bursts with sharp attacks at 5 / 20 / 35 / 50 / 65 / 80s, so every onset is unmistakable.</p>
<div id="log">working…</div>
<div id="after"></div>
<script type="module">
const log = document.getElementById('log')
const say = (m) => { log.textContent += (log.textContent === 'working…' ? '\n' : '\n') + m }
const fail = (m) => { log.textContent = '✕ ' + m }

const ONSETS = [5, 20, 35, 50, 65, 80]
const SR = 22050, DUR = 120

function wav() {
  const n = SR * DUR
  const pcm = new Int16Array(n)
  for (const t of ONSETS) {
    const s = Math.floor(t * SR), len = Math.floor(0.8 * SR)
    for (let i = 0; i < len; i++) {
      const env = Math.min(1, i / (0.005 * SR)) * Math.exp(-i / (0.25 * SR))
      pcm[s + i] = Math.round(20000 * env * Math.sin(2 * Math.PI * 440 * i / SR))
    }
  }
  const b = new ArrayBuffer(44 + n * 2), dv = new DataView(b)
  const wr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)) }
  wr(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); wr(8, 'WAVE'); wr(12, 'fmt ')
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true)
  dv.setUint32(24, SR, true); dv.setUint32(28, SR * 2, true); dv.setUint16(32, 2, true)
  dv.setUint16(34, 16, true); wr(36, 'data'); dv.setUint32(40, n * 2, true)
  new Int16Array(b, 44).set(pcm)
  return b
}

function envelope() {
  const hopSec = 0.02, frames = Math.ceil(DUR / hopSec)
  const activity = new Float32Array(frames), onset = new Float32Array(frames)
  for (const t of ONSETS) {
    const oi = Math.floor(t / hopSec)
    onset[oi] = 1
    for (let f = oi; f < Math.min(frames, oi + Math.floor(0.8 / hopSec)); f++) activity[f] = 1
  }
  return { hopSec, activity, onset, source: 'stem' }
}

const LINES = [
  { startTime: 5,    endTime: 8,  original: 'ラインいち',     translation: 'line one — correct (5s)' },
  { startTime: 20,   endTime: 23, original: 'ラインに',       translation: 'line two — correct (20s)' },
  { startTime: 34.6, endTime: 38, original: 'おくれたライン', translation: 'FLAGGED — 0.4s early, true 35s' },
  { startTime: 50,   endTime: 53, original: 'ラインよん',     translation: 'line four — correct (50s)' },
  { startTime: 61.2, endTime: 64, original: 'はやいライン',   translation: 'FLAGGED — 3.8s early, true 65s' },
  { startTime: 71,   endTime: 75, original: 'ラインろく',     translation: 'FLAGGED — 9s early, true 80s' },
]

/**
 * Two ways to write OPFS. createWritable() is what the app itself uses and works
 * on Chrome and on Firefox 111+ (so Zen too). createSyncAccessHandle() is the
 * older Firefox-native path and is worker-only, so it goes in a worker. Trying
 * the first and falling back means this page does not depend on which engine you
 * happen to be on.
 */
async function writeOpfs(buffer) {
  const root = await navigator.storage.getDirectory()
  const dir = await root.getDirectoryHandle('songs', { create: true })
  const fh = await dir.getFileHandle('dragmeasure.mp3', { create: true })
  if (typeof fh.createWritable === 'function') {
    try {
      const w = await fh.createWritable()
      await w.write(buffer)
      await w.close()
      return 'createWritable'
    } catch (e) {
      say('· createWritable failed (' + e.name + '), trying the worker path')
    }
  } else {
    say('· no createWritable on this engine, using the worker path')
  }
  // Worker fallback: createSyncAccessHandle is only callable off the main thread.
  const src = `onmessage = async (e) => {
    try {
      const root = await navigator.storage.getDirectory()
      const dir = await root.getDirectoryHandle('songs', { create: true })
      const fh = await dir.getFileHandle('dragmeasure.mp3', { create: true })
      const h = await fh.createSyncAccessHandle()
      h.truncate(0)
      h.write(new Uint8Array(e.data), { at: 0 })
      h.flush(); h.close()
      postMessage({ ok: true })
    } catch (err) { postMessage({ ok: false, error: String(err) }) }
  }`
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }))
  const worker = new Worker(url)
  const result = await new Promise((res) => {
    worker.onmessage = (e) => res(e.data)
    worker.onerror = (e) => res({ ok: false, error: e.message || 'worker failed' })
    worker.postMessage(buffer, [buffer])
  })
  worker.terminate(); URL.revokeObjectURL(url)
  if (!result.ok) throw new Error('could not write OPFS: ' + result.error)
  return 'createSyncAccessHandle (worker)'
}

try {
  say('· engine: ' + (navigator.userAgent.includes('Firefox') ? 'Gecko / Firefox-based (Zen counts)' : 'Chromium-based'))
  // OPFS is per-origin, so writing here is what the app will read.
  const how = await writeOpfs(wav())
  say('✓ audio written to OPFS via ' + how + ' (5.0 MB, 120s, 6 tone bursts)')

  // Open WITHOUT a version so we never force an upgrade the app disagrees with.
  const db = await new Promise((res, rej) => {
    const r = indexedDB.open('utasync')
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error)
  })
  if (![...db.objectStoreNames].includes('songs')) {
    fail("this browser hasn't created the utasync database yet.\n\nOpen http://localhost:5173/ once (so the app builds it), then reload this page.")
    throw new Error('no store')
  }
  say(`✓ found utasync database (v${db.version})`)

  const song = {
    id: 'dragmeasure', title: 'Drag Measure', artist: 'drag-retime fixture',
    audioStoredPath: 'songs/dragmeasure.mp3', durationSec: DUR,
    createdAt: new Date(), syncState: 'synced',
    sources: [{ provider: 'upload', ref: 'dragmeasure', hasAudio: true }],
    lyrics: {
      lines: LINES, sourceLanguage: 'ja', translationLanguage: 'en',
      alignmentMode: 'auto', alignmentConfidence: 0.8,
      // High stamps so opening it does not kick off a real align or gap pass.
      alignmentPipelineVersion: 9999, gapRecoveryVersion: 9999, enrichmentVersion: 9999,
      lineAlignmentQuality: ['good', 'good', 'needs_review', 'good', 'needs_review', 'needs_review'],
      timingAnchors: [],
      vocalActivity: envelope(),
    },
  }
  await new Promise((res, rej) => {
    const tx = db.transaction('songs', 'readwrite')
    tx.objectStore('songs').put(song)
    tx.oncomplete = res; tx.onerror = () => rej(tx.error)
  })
  const back = await new Promise((res, rej) => {
    const tx = db.transaction('songs', 'readonly')
    const q = tx.objectStore('songs').get('dragmeasure')
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error)
  })
  say(`✓ song stored — envelope round-tripped as ${back.lyrics.vocalActivity.activity.constructor.name}, ${back.lyrics.vocalActivity.activity.length} frames`)
  say('✓ 3 lines flagged for re-timing')

  document.getElementById('after').innerHTML = `
    <a class="go" href="/#/song/dragmeasure">Open Drag Measure →</a>
    <table>
      <tr><th>line</th><th>stored</th><th>true onset</th><th>what it exercises</th></tr>
      <tr><td>おくれたライン</td><td>34.6s</td><td>35s</td><td>ordinary case — snapping cleans up the last pixels</td></tr>
      <tr><td>はやいライン</td><td>61.2s</td><td>65s</td><td>3.8s out — only reachable since the window widened</td></tr>
      <tr><td>ラインろく</td><td>71s</td><td>80s</td><td>9s out — needs two passes; pass 1 stays flagged</td></tr>
    </table>
    <p style="color:#f5eaea99;font-size:13.5px;margin-top:1.25rem">
      Press play and let it run into a flagged line. To reset after committing, just reload this page.
      <br><br><strong>On precision:</strong> the 44ms-per-pixel figure is the narrow-phone case
      (194px strip at a 375px viewport). A wide desktop window makes the strip several times wider
      and the drag correspondingly finer — so if you want to judge whether it feels twitchy, narrow
      the window to phone width first, or the test is not the same one.
      <br><br>Nothing here needs WebGPU: the pipeline version stamps are set high so opening the song
      cannot trigger an align, and the onset envelope is written by hand rather than computed.
      Delete <code>public/seed-drag-fixture.html</code> when you're done — it is untracked and not part of the PR.
    </p>`
} catch (e) {
  if (String(e.message) !== 'no store') fail(String(e))
}
</script>
