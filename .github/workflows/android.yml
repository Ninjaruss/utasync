# Native Android shell (android/). Runs EVERY JVM unit test (:align, :data, :playback, :app)
# and then a debug APK build of :app. assembleDebug does not compile unit-test sources, so the
# test tasks have to be named: without them a change that breaks resolveStarts goes green.
# Only the instrumented tests (:data, :playback androidTest) stay out — they need an emulator.
#
# The paths filter below covers files OUTSIDE android/ on purpose. :japanese's understanding
# audit scores the real dictionary, which it reads from the PWA's public/jmdict-*.json via the
# conversion in scripts/build-japanese-db.mjs, and its `right` count is a ratchet. Editing that
# data or that script moves an Android test, so a filter of android/** alone would let the
# break land on an unrelated later PR with no clue where it came from.

name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      # Inputs to :japanese's audit ratchet (see the note at the top of this file).
      - "public/jmdict-popover.json"
      - "public/jmdict-readings.json"
      - "scripts/build-japanese-db.mjs"
      - "scripts/build-audit-digest.mjs"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      # Inputs to :japanese's audit ratchet (see the note at the top of this file).
      - "public/jmdict-popover.json"
      - "public/jmdict-readings.json"
      - "scripts/build-japanese-db.mjs"
      - "scripts/build-audit-digest.mjs"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # Checks the committed gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships an Android SDK (ANDROID_HOME); AGP installs any missing
      # build-tools itself.
      - name: Unit tests and debug build
        run: >-
          ./gradlew
          :align:test
          :data:testDebugUnitTest
          :playback:testDebugUnitTest
          :prepare:testDebugUnitTest
          :japanese:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          --stacktrace
