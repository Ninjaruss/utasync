# Native Android shell (android/). Runs EVERY JVM unit test (:align, :data, :playback, :app)
# and then a debug APK build of :app. assembleDebug does not compile unit-test sources, so the
# test tasks have to be named: without them a change that breaks resolveStarts goes green.
# Only the instrumented tests (:data, :playback androidTest) stay out — they need an emulator.

name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # Checks the committed gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships an Android SDK (ANDROID_HOME); AGP installs any missing
      # build-tools itself.
      - name: Unit tests and debug build
        run: >-
          ./gradlew
          :align:test
          :data:testDebugUnitTest
          :playback:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          --stacktrace
