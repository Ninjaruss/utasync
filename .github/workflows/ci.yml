# Typecheck, lint and unit tests on every push and pull request.
#
# Tests that read copyrighted fixtures (lyric sheets, catalogue LRCs, Whisper
# transcripts) are listed in tests/privateFixtures.mjs. Those files are not in git,
# so vite.config.ts excludes their tests here; they still run on a machine that has
# the local copies. The CPU-bound corpus ratchets that used to make this suite flaky
# under load are among them.
#
# Still deliberately NOT here:
#
#   * `npm run build`. Its `prebuild` step downloads a ~64 MB model, making it slow
#     and network-dependent. Add it once that download is cached or removed.
#   * Typechecking `tests/`. That directory is outside every tsconfig project, and
#     about 81 type errors live there. Fix them, add tests/ to a tsconfig, then add
#     `npx tsc -p <that config>` below.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the development version, so a local pass means a CI pass.
          node-version: 24
          cache: npm

      # The `prepare` script runs on install; its ensure-*/copy-* steps are no-ops
      # because the generated dictionaries and glosses are committed to the repo.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run --reporter=dot
